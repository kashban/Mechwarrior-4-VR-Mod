name: Mutation tests

# Do the tests find bugs? tests/mutate.py plants one small error at a time into core.h and the converter and runs
# their tests; a score below its floor (tests/mutation_floor.json, 100 %) fails. Every night after a day with
# commits, and by hand. Not on pull requests: a run takes some 25 minutes of a Windows runner, and every push to
# such a pull request began one. Who changes core.h, the converter or their tests runs it before the pull request
# (python tests/mutate.py, two minutes on a developer's PC); the night's run is the gate.
on:
  schedule:
    - cron: '30 2 * * *' # 02:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: core.h and the converter
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 50
      - name: Anything new since the night before?
        id: news
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != schedule ] || [ -n "$(git log -1 --since='25 hours ago' --format=%H)" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "no commit in the last day - nothing to do"
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.news.outputs.run == 'yes'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install the converter's libraries
        if: steps.news.outputs.run == 'yes'
        run: python -m pip install -r requirements.txt
      - name: Visual Studio's x86 compiler
        if: steps.news.outputs.run == 'yes'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x86
      - name: Mutation tests (fails below the floor)
        if: steps.news.outputs.run == 'yes'
        run: python tests/mutate.py
