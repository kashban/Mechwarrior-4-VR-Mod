name: CI

# Every push to main and every pull request: the mod builds, its tests pass, the converter's tests cover it, the
# package can be put together, and nothing is in the repository that must not be (docs/PIPELINE.md).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, tests, coverage gate, package
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install the converter's libraries and the test tools
        run: python -m pip install -r requirements.txt -r requirements-ci.txt
      - name: Visual Studio's x86 compiler (the game is a 32-bit process)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x86
      - name: Build d3d11.dll and dinput.dll
        shell: cmd
        run: mod\build.bat
      - name: Tests of core.h
        shell: cmd
        run: tests\core_test.bat
      - name: The shader tests have a compiler here
        run: python -c "import sys; sys.path.insert(0, 'tests'); import test_shaders; sys.exit(0 if test_shaders.FXC else 'no fxc.exe on the runner - the shader tests would be skipped')"
      - name: Python tests (converter, shaders, ABI, guard) under coverage
        run: python -W error -m coverage run -m unittest discover -s tests
      - name: Coverage gate (converter and guard, 95 % of the lines)
        run: python -m coverage report --include="tools/cockpit_convert.py,tools/ci/guard.py" --show-missing --fail-under=95
      - name: Package (without the trees; refuses anything of MechWarrior 5)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\package.ps1 -SkipTests
      - name: Keep the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: release/*.zip
          retention-days: 14

  guards:
    name: Guards (foreign assets, private data, secrets, dependencies)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history: the guard and gitleaks read all of it
      - name: Nothing of MechWarrior 5, no private data - now and in history
        run: python3 tools/ci/guard.py --history
      - name: Tests of the AI review's script (mock model server, mock GitHub)
        run: node --test tools/ci/ai-review.test.mjs
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/bin" gitleaks && rm gitleaks.tar.gz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: No secrets in the code or its history (gitleaks)
        run: gitleaks git --redact --no-banner .
      - name: No known vulnerabilities in the converter's libraries (pip-audit)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q -r requirements-ci.txt
          "$RUNNER_TEMP/venv/bin/pip-audit" -r requirements.txt

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q semgrep==1.185.0
      - name: Scan (fails on findings)
        run: '"$RUNNER_TEMP/venv/bin/semgrep" scan --error --metrics=off --config p/python --config p/security-audit --config p/github-actions tools tests docs .github'
