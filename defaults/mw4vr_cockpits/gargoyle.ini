; Settings of this cockpit for MW4VR. Written once by cockpit_convert.py; change it as you like.
[cockpit]
; the eye in the mesh (metres) and the size of the mesh; in a battle: Ctrl+Alt+arrows, Ctrl+Alt+PgUp / PgDn
scale=1.000
eye_right_m=0.000
eye_up_m=0.000
eye_forward_m=0.000
; 1 = the monitors show the HUD; 0 = the HUD floats in front as without a cockpit of our own
screens=1
; screen_<n> = u0 v0 u1 v1: the part of the HUD picture monitor n shows (none: dark). The monitors, left to right:
;   0: -0.81 m to the right, 0.95 m ahead, 176 cm2
;   1: -0.79 m to the right, 0.92 m ahead, 153 cm2
;   2: -0.60 m to the right, -0.43 m ahead, 252 cm2
;   3: -0.08 m to the right, 0.53 m ahead, 189 cm2
;   4: -0.00 m to the right, 0.73 m ahead, 565 cm2
;   5: 0.62 m to the right, 0.06 m ahead, 204 cm2
;   6: 0.75 m to the right, 0.92 m ahead, 193 cm2
;   7: 0.83 m to the right, 0.92 m ahead, 346 cm2
; lance
screen_0=0.000 0.000 0.243 0.108
screen_0_alt=0.000 0.000 0.243 0.435 0.210 0.125
; target
screen_3=0.000 0.772 0.180 1.000
; radar
screen_4=0.320 0.770 0.690 0.990
; damage
