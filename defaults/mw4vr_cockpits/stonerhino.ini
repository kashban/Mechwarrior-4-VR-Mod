; Settings of this cockpit for MW4VR. Written once by cockpit_convert.py; change it as you like.
[cockpit]
; the eye in the mesh (metres) and the size of the mesh; in a battle: Ctrl+Alt+arrows, Ctrl+Alt+PgUp / PgDn
scale=1.000
eye_right_m=0.000
eye_up_m=0.000
eye_forward_m=0.000
; 1 = the monitors show the HUD; 0 = the HUD floats in front as without a cockpit of our own
screens=1
; screen_<n> = u0 v0 u1 v1: the part of the HUD picture monitor n shows (none: dark). The monitors, left to right:
;   0: -0.53 m to the right, 0.39 m ahead, 230 cm2
;   1: -0.34 m to the right, 0.45 m ahead, 112 cm2
;   2: 0.00 m to the right, 0.57 m ahead, 112 cm2
;   3: 0.75 m to the right, 0.06 m ahead, 112 cm2
; lance
screen_0=0.000 0.000 0.243 0.108
screen_0_alt=0.000 0.000 0.243 0.435 0.210 0.125
; target
screen_1=0.000 0.772 0.180 1.000
; radar
screen_2=0.320 0.770 0.690 0.990
; damage
screen_3=0.820 0.772 1.005 1.000
