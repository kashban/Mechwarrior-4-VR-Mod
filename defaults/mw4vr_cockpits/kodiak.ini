; Settings of this cockpit for MW4VR. Written once by cockpit_convert.py; change it as you like.
[cockpit]
; the eye in the mesh (metres) and the size of the mesh; in a battle: Ctrl+Alt+arrows, Ctrl+Alt+PgUp / PgDn
scale=1.000
eye_right_m=0.000
eye_up_m=0.000
eye_forward_m=-0.080
; 1 = the monitors show the HUD; 0 = the HUD floats in front as without a cockpit of our own
screens=1
; screen_<n> = u0 v0 u1 v1: the part of the HUD picture monitor n shows (none: dark). The monitors, left to right:
;   0: -0.95 m to the right, 0.18 m ahead, 286 cm2
;   1: -0.63 m to the right, 0.72 m ahead, 176 cm2
;   2: -0.03 m to the right, 0.17 m ahead, 223 cm2
;   3: -0.00 m to the right, 0.40 m ahead, 344 cm2
;   4: 0.40 m to the right, 0.45 m ahead, 168 cm2
;   5: 0.61 m to the right, -0.18 m ahead, 159 cm2
;   6: 0.85 m to the right, 0.30 m ahead, 217 cm2
;   7: 0.95 m to the right, 0.18 m ahead, 286 cm2
