; Settings of this cockpit for MW4VR. Written once by cockpit_convert.py; change it as you like.
[cockpit]
; the eye in the mesh (metres) and the size of the mesh; in a battle: Ctrl+Alt+arrows, Ctrl+Alt+PgUp / PgDn
scale=1.000
eye_right_m=0.000
eye_up_m=0.000
eye_forward_m=0.000
; 1 = the monitors show the HUD; 0 = the HUD floats in front as without a cockpit of our own
screens=1
; screen_<n> = u0 v0 u1 v1: the part of the HUD picture monitor n shows (none: dark). The monitors, left to right:
;   0: -0.95 m to the right, 0.15 m ahead, 146 cm2
;   1: -0.79 m to the right, 0.50 m ahead, 227 cm2
;   2: -0.45 m to the right, 0.47 m ahead, 316 cm2
;   3: -0.13 m to the right, 0.46 m ahead, 155 cm2
;   4: 0.32 m to the right, 0.91 m ahead, 229 cm2
;   5: 0.79 m to the right, 0.24 m ahead, 130 cm2
;   6: 0.82 m to the right, 0.52 m ahead, 159 cm2
;   7: 0.88 m to the right, 0.30 m ahead, 147 cm2
; lance
screen_1=0.000 0.000 0.243 0.108
screen_1_alt=0.000 0.000 0.243 0.435 0.210 0.125
