; Settings of this cockpit for MW4VR. Written once by cockpit_convert.py; change it as you like.
[cockpit]
; the eye in the mesh (metres) and the size of the mesh; in a battle: Ctrl+Alt+arrows, Ctrl+Alt+PgUp / PgDn
scale=1.000
eye_right_m=0.000
eye_up_m=0.000
eye_forward_m=0.000
; 1 = the monitors show the HUD; 0 = the HUD floats in front as without a cockpit of our own
screens=1
; screen_<n> = u0 v0 u1 v1: the part of the HUD picture monitor n shows (none: dark). The monitors, left to right:
;   0: -0.81 m to the right, 0.13 m ahead, 248 cm2
;   1: -0.62 m to the right, -0.45 m ahead, 228 cm2
;   2: -0.01 m to the right, 0.69 m ahead, 212 cm2
;   3: 0.31 m to the right, 0.55 m ahead, 189 cm2
;   4: 0.64 m to the right, 0.46 m ahead, 133 cm2
;   5: 0.64 m to the right, 0.57 m ahead, 442 cm2
;   6: 0.70 m to the right, -0.24 m ahead, 170 cm2
;   7: 0.77 m to the right, 0.12 m ahead, 189 cm2
; target
screen_0=0.000 0.772 0.180 1.000
; radar
screen_2=0.320 0.770 0.690 0.990
; damage
screen_3=0.820 0.772 1.005 1.000
; weapons
screen_5=0.716 0.000 1.000 0.124
