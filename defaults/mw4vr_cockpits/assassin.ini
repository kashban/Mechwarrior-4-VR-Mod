; Settings of this cockpit for MW4VR. Written once by cockpit_convert.py; change it as you like.
[cockpit]
; the eye in the mesh (metres) and the size of the mesh; in a battle: Ctrl+Alt+arrows, Ctrl+Alt+PgUp / PgDn
scale=1.000
eye_right_m=0.000
eye_up_m=0.000
eye_forward_m=0.000
; 1 = the monitors show the HUD; 0 = the HUD floats in front as without a cockpit of our own
screens=0
glass_radar=0.0 -39.0 20.0 0.90
glass_target=-15.0 -33.0 10.3 0.89
glass_damage=17.0 -33.0 8.9 0.89
glass_lance=-29.0 1.0 12.2 0.85
glass_weapons=29.0 -8.0 14.2 0.87
glass_top=0.0 16.0 30.0 1.20
; screen_<n> = u0 v0 u1 v1: the part of the HUD picture monitor n shows (none: dark). The monitors, left to right:
