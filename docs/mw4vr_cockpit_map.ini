; Which MW5 cockpit a MW4 mech gets while nothing else is chosen for it (Ctrl+Alt+F11 in a battle
; chooses another one and remembers it in mw4vr_mechs.ini - that choice wins over this list).
; Left: the mech's folder in the game's files (mechs\<name>\..., what the log calls the mech).
; Right: a cockpit file in mw4vr_cockpits, without ".mwc" - or several, the best first: the first there is a
; file of is used (a cockpit from a MechWarrior 5 mod, then one of the game's own for who has not got that
; mod). Goes into the game's folder.
